# ── Dependabot ────────────────────────────────────────────────────────────────
# Weekly dependency updates against `dev`. CI must pass before merge.
version: 2

updates:
  - package-ecosystem: github-actions
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. Dependabot security updates are exempt
    # from cooldown and still open the moment an advisory lands.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"

  # Single root manifest — npm workspaces resolve apps/* and packages/*.
  - package-ecosystem: npm
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. Dependabot security updates are exempt
    # from cooldown and still open the moment an advisory lands.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      non-breaking:
        update-types: [minor, patch]
    ignore:
      # ESLint 10 breaks eslint-config-next@16's plugin chain
      # (`scopeManager.addGlobals is not a function`) — pinned to 9.x per
      # ADR 0004. Remove this once eslint-config-next supports ESLint 10.
      - dependency-name: "eslint"
        versions: ["10.x"]
