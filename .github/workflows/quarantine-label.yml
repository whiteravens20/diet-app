name: Dependabot Quarantine Label

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Re-check daily at 06:00 UTC — clears labels once quarantine passes
    - cron: '0 6 * * *'

permissions: {}

jobs:
  # Runs on PR events for Dependabot PRs
  check-pr:
    name: Check quarantine on PR
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check package quarantine
        id: quarantine
        env:
          QUARANTINE_DAYS: 7
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESULT=$(node .github/scripts/check-quarantine.mjs "${{ github.event.pull_request.number }}")
          echo "blocked=$(echo "$RESULT" | jq -r .blocked)" >> "$GITHUB_OUTPUT"
          {
            echo "details<<__QUARANTINE_EOF__"
            echo "$RESULT" | jq -r .details
            echo "__QUARANTINE_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Add quarantine label
        if: steps.quarantine.outputs.blocked == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DETAILS: ${{ steps.quarantine.outputs.details }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "min-release-age"
          # Only comment if this is a new label addition (avoid spam on re-runs)
          EXISTING=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -c "min-release-age quarantine" || true)
          if [ "$EXISTING" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --body "🔒 **min-release-age quarantine**
          The following packages do not yet meet the 7-day release-age policy:
          ${DETAILS}
          This label will be automatically removed once all packages pass quarantine. Re-checked daily at 06:00 UTC."
          fi

      - name: Remove quarantine label
        if: steps.quarantine.outputs.blocked == 'false'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS_LABEL=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -c "min-release-age" || true)
          if [ "$HAS_LABEL" -gt 0 ]; then
            gh pr edit "$PR_NUMBER" --remove-label "min-release-age"
            gh pr comment "$PR_NUMBER" --body "✅ **Quarantine cleared** — all packages now meet the 7-day release-age policy. Safe to merge."
          fi

  # Scheduled re-check of all open Dependabot PRs with the quarantine label
  recheck:
    name: Re-check quarantined PRs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Re-check all quarantined PRs
        env:
          QUARANTINE_DAYS: 7
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRS=$(gh pr list --state open --label "min-release-age" --json number --jq '.[].number')

          if [ -z "$PRS" ]; then
            echo "No quarantined PRs found."
            exit 0
          fi

          for PR_NUMBER in $PRS; do
            echo "--- Checking PR #${PR_NUMBER} ---"
            RESULT=$(node .github/scripts/check-quarantine.mjs "$PR_NUMBER")
            if [ "$(echo "$RESULT" | jq -r .blocked)" = "false" ]; then
              echo "  Quarantine cleared for PR #${PR_NUMBER}"
              gh pr edit "$PR_NUMBER" --remove-label "min-release-age"
              gh pr comment "$PR_NUMBER" --body "✅ **Quarantine cleared** — all packages now meet the 7-day release-age policy. Safe to merge."
            else
              echo "  PR #${PR_NUMBER} still under quarantine"
            fi
          done
