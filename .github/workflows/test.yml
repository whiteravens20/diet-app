# ── CI ────────────────────────────────────────────────────────────────────────
# Lint, typecheck, build and test the monorepo. The job names `api`, `web`,
# `markers` and `docker` are required status checks on `dev` and `main`.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: diet
          POSTGRES_PASSWORD: diet
          POSTGRES_DB: diet_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U diet" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://diet:diet@localhost:5432/diet_app_test?schema=public
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      # The migrations must apply to an empty database and leave it exactly as
      # schema.prisma describes; `--exit-code` fails the step on any difference.
      - run: npm run db:migrate
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        working-directory: apps/api
      - run: npm run lint -- --filter=@diet-app/api
      - run: npm run typecheck -- --filter=@diet-app/api
      - run: npm run data:lint
      - run: npm run test -- --filter=@diet-app/shared
      # Unit and integration tests together. The integration tests start the API
      # on the PostgreSQL service above, in a database of their own. Coverage-gated:
      # vitest fails the job if a threshold in vitest.config.ts regresses.
      - run: npm run test:cov -- --filter=@diet-app/api
      - run: npm run build -- --filter=@diet-app/api

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint -- --filter=@diet-app/web
      - run: npm run typecheck -- --filter=@diet-app/web
      - run: npm run test -- --filter=@diet-app/web
      - run: npm run build -- --filter=@diet-app/web

  markers:
    name: markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check intra-repo doc links
        run: node scripts/check-doc-links.mjs
      - name: Reject roadmap/TODO markers in shipped source
        # The release gate forbids historical-phase / roadmap / TODO markers in
        # shipped code comments. Bare feature refs (F19, F10) are allowed; the
        # hyphenated F-XX roadmap form is not. Tests are excluded.
        run: |
          set -uo pipefail
          hits=$(grep -rniE 'phase [a-z0-9]|coming soon|\bTODO\b|\bFIXME\b|\bF-[0-9]' \
            apps/*/src packages/*/src --include='*.ts' --include='*.tsx' \
            | grep -v '\.test\.' || true)
          if [ -n "$hits" ]; then
            echo "::error::Forbidden roadmap/TODO marker(s) in shipped source:"
            echo "$hits"
            exit 1
          fi
          echo "No forbidden markers."

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate the Docker image builds
        run: docker build -f infra/docker/Dockerfile -t diet-app:ci .
