# ── CI ────────────────────────────────────────────────────────────────────────
# Lint, typecheck, build and test the monorepo. The job names `api`, `web`,
# `markers` and `docker` are required status checks on `dev` and `main`.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: diet
          POSTGRES_PASSWORD: diet
          POSTGRES_DB: diet_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U diet" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://diet:diet@localhost:5432/diet_app_test?schema=public
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      # The migrations must apply to an empty database and leave it exactly as
      # schema.prisma describes; `--exit-code` fails the step on any difference.
      - run: npm run db:migrate
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        working-directory: apps/api
      - run: npm run lint -- --filter=@diet-app/api
      - run: npm run typecheck -- --filter=@diet-app/api
      # Nothing is exported, kept as a file or declared as a dependency that
      # nothing uses, in any workspace: knip.jsonc names the entry points.
      - run: npm run knip
      - run: npm run data:lint
      - run: npm run test -- --filter=@diet-app/shared
      # Unit and integration tests together. The integration tests start the API
      # on the PostgreSQL service above, in a database of their own. Coverage-gated:
      # vitest fails the job if a threshold in vitest.config.ts regresses.
      - run: npm run test:cov -- --filter=@diet-app/api
      # The API with a reference catalogue of 2,000 recipes in the same
      # PostgreSQL, asked what an account asks: fails when a path is over its
      # budget of time or of statements, and prints what every path took.
      - run: npm run bench
      - run: npm run build -- --filter=@diet-app/api

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint -- --filter=@diet-app/web
      - run: npm run typecheck -- --filter=@diet-app/web
      # Coverage-gated like the API's: vitest fails the job when a floor in
      # vitest.config.ts is not reached.
      - run: npm run test:cov -- --filter=@diet-app/web
      - run: npm run build -- --filter=@diet-app/web

  markers:
    name: markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check intra-repo doc links
        run: node scripts/check-doc-links.mjs
      - name: Reject planning labels and dangling references
        # A comment, a test name or a document says what the code does. The
        # script's header lists what is rejected and why.
        run: |
          node --test scripts/check-markers.test.mjs
          node scripts/check-markers.mjs

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The stack is built and started the way the README says, from a freshly
      # generated .env, with the API's host port moved off its default: a setup
      # that only works on the defaults, does not build or does not start
      # fails here. The admin panel gets a password of this run's own, so that
      # the browser tests can fill the catalogue the way an administrator does.
      - name: Build and boot the stack, and reach the API directly and through the web proxy
        run: |
          sh scripts/init-env.sh
          sed -i 's/^API_PORT=.*/API_PORT=4100/' .env
          sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')/" .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d --build
          for attempt in $(seq 1 60); do
            health() { docker inspect --format '{{.State.Health.Status}}' "$(docker compose --env-file .env -f infra/docker-compose.yml ps -q "$1")"; }
            if curl -fsS -o /dev/null http://localhost:4100/api/health \
              && curl -fsS -o /dev/null http://localhost:3000/api/health \
              && curl -fsS -o /dev/null http://localhost:3000/ \
              && [ "$(health api)" = healthy ] && [ "$(health web)" = healthy ] \
              && docker compose --env-file .env -f infra/docker-compose.yml logs --no-color worker | grep -q 'Worker started'; then
              echo "Up and healthy after $attempt attempt(s)."
              # The worker has no health check: it runs its jobs once when it
              # starts, and one that fails says so in its log.
              if docker compose --env-file .env -f infra/docker-compose.yml logs --no-color worker | grep ' failed: '; then
                echo "::error::A job of the worker failed at its first run."
                exit 1
              fi
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env -f infra/docker-compose.yml ps
          docker compose --env-file .env -f infra/docker-compose.yml logs --no-color --tail 60
          exit 1
      # What only a browser shows is tested in one, against the stack that
      # just came up: that nothing keeps somebody from using a page, in both
      # languages, on a phone and on a desktop, in light and dark; how a window
      # over a page and the navigation behave; that every page fits a narrow
      # screen; and what an account leaves behind in the page.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Install the browser the tests drive
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests against the stack
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          E2E_ADMIN_USER="$(sed -n 's/^ADMIN_USER=//p' ../../.env)" \
          E2E_ADMIN_PASSWORD="$(sed -n 's/^ADMIN_PASSWORD=//p' ../../.env)" \
            npx playwright test
      - name: Check that the unedited template is refused
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml down -v
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d --no-build
          sleep 25
          if curl -fsS -o /dev/null http://localhost:4000/api/health; then
            echo "::error::The API started on the template's blank secrets."
            exit 1
          fi
          docker compose --env-file .env -f infra/docker-compose.yml logs --no-color api | grep -q 'JWT_ACCESS_SECRET'
