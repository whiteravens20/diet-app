name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      # Production dependencies get the tighter bar (moderate): they ship in the
      # image. Everything else stays at high.
      #
      # audit-check.mjs wraps `npm audit` so that an advisory with no installable
      # fix and no reachable code path can be allowlisted on its own, with a
      # justification and an expiry, instead of lowering the bar for every
      # package. See .github/scripts/audit-allowlist.json.
      - name: Audit (production, moderate)
        run: node .github/scripts/audit-check.mjs --dir . --omit=dev --audit-level moderate

      - name: Audit (all dependencies, high)
        run: node .github/scripts/audit-check.mjs --dir . --audit-level high

      # Verify every installed tarball has a valid registry signature.
      # `audit signatures` reads node_modules, so it needs an install first.
      - name: Install (for signature audit)
        run: npm ci

      - name: Verify package signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only runs on pull requests — compares new deps against known vulnerabilities
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # The project is AGPL-3.0-only. These two licences cannot be combined
          # with it, so a dependency under either must not come in.
          deny-licenses: GPL-2.0-only, SSPL-1.0
          # Any allowlisted ID goes here as `allow-ghsas:`, and its justification
          # in .github/scripts/audit-allowlist.json. Keep the two in sync.

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Trivy on repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail the build on HIGH/CRITICAL vulnerabilities

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Builds the image every service runs from and scans what is actually in it:
  # the OS packages of the base and the modules that ship, not the dev tree.
  trivy-docker:
    name: Trivy Docker image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile -t diet-app:ci .

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: diet-app:ci
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-docker.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail the build on HIGH/CRITICAL vulnerabilities

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-docker.sarif
          category: trivy-docker

  # Every action in these workflows is pinned to a commit SHA, with its version
  # in a comment. This checks that each SHA is the commit of the version named
  # beside it, so a wrong SHA and a tag moved upstream both fail here.
  pins:
    name: Pinned actions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check each SHA against the tag it names
        run: .github/scripts/verify-pins.sh

  # Dependabot raises no alert for an action pinned by SHA, so this asks GitHub's
  # advisory database about every pinned version in its place.
  actions-audit:
    name: Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Look up each pinned version in the advisory database
        run: .github/scripts/verify-pins.sh --advisories
        env:
          GH_TOKEN: ${{ github.token }}
