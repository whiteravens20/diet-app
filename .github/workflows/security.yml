name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Production dependencies get the tighter bar (moderate): they ship in the
      # image. Everything else stays at high.
      #
      # audit-check.mjs wraps `npm audit` so that an advisory with no installable
      # fix and no reachable code path can be allowlisted on its own, with a
      # justification and an expiry, instead of lowering the bar for every
      # package. See .github/scripts/audit-allowlist.json.
      - name: Audit (production, moderate)
        run: node .github/scripts/audit-check.mjs --dir . --omit=dev --audit-level moderate

      - name: Audit (all dependencies, high)
        run: node .github/scripts/audit-check.mjs --dir . --audit-level high

      # Verify every installed tarball has a valid registry signature.
      # `audit signatures` reads node_modules, so it needs an install first.
      - name: Install (for signature audit)
        run: npm ci

      - name: Verify package signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy on repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
