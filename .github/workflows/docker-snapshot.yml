# ── Diet App — Snapshot Build ─────────────────────────────────────────────────
#
# Builds the Docker image ON DEMAND (manual workflow_dispatch) from the branch
# it is run from and publishes it to GHCR, so a snapshot can be pulled and
# tested without building locally. Nothing is built automatically, and a
# snapshot is NOT a release: a semver tag and the release workflow are for that.
#
# Run it:  Actions → "Snapshot build" → Run workflow, from `dev` or `main`.
#
# Tags and scan, by the branch it is run from:
#   dev   → :dev  + :dev-<7-char-sha>   the scan REPORTS ONLY
#   main  → :edge + :edge-<7-char-sha>  the scan FAILS on HIGH/CRITICAL: the
#                                       last check before a release tag
# Any other branch is refused, so nothing but `main` can move `:edge`.
#
# Pull to test:  set IMAGE_TAG=<tag> in the .env of infra/docker-compose.prod.yml.
#
# ─────────────────────────────────────────────────────────────────────────────

name: Snapshot build

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-push:
    name: Build ${{ github.ref_name }} snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-ref: ${{ steps.img-ref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute snapshot tags
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          case "$BRANCH" in
            dev) PREFIX=dev ;;
            main) PREFIX=edge ;;
            *) echo "::error::A snapshot is built from dev or main, not from ${BRANCH}."; exit 1 ;;
          esac
          {
            echo "value<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${PREFIX}"
            echo "${REGISTRY}/${IMAGE_NAME}:${PREFIX}-${SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.value }}
          # Different on every run, so the layer that upgrades the OS packages
          # is built again and not restored from the cache below.
          build-args: |
            CACHE_BUST_APK=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image ref for scan
        id: img-ref
        # The scan reads the digest this run pushed, never a tag that another
        # run can move in the meantime.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # ── Trivy scan ────────────────────────────────────────────────────────────────
  #   dev   → exit-code 0  findings reported to the Security tab; the run stays green
  #   main  → exit-code 1  fails on any finding .trivyignore does not acknowledge
  # Add CVE IDs to .trivyignore (with justification) to acknowledge and unblock.
  scan:
    name: Trivy scan
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout (for .trivyignore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build-push.outputs.image-ref }}
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: ${{ github.ref_name == 'main' && '1' || '0' }}
          format: sarif
          output: trivy-snapshot.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-snapshot.sarif
          category: trivy-snapshot
