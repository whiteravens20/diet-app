# ── Diet App — Snapshot Build ─────────────────────────────────────────────────
#
# Manually-triggered build of the Docker image from `dev`. Publishes to GHCR
# with the `:dev` tag so a snapshot can be pulled and tested without building
# locally. It is NOT a production release — a semver tag and the release
# workflow are for that.
#
# Run it:  Actions → "Snapshot build" → Run workflow (pick the `dev` branch).
#
# Tags produced:
#   ghcr.io/whiteravens20/diet-app:dev
#   ghcr.io/whiteravens20/diet-app:dev-<7-char-sha>
#
# Pull to test:  docker pull ghcr.io/whiteravens20/diet-app:dev
# Run it with IMAGE_TAG=dev in the .env of infra/docker-compose.prod.yml.
#
# ─────────────────────────────────────────────────────────────────────────────

name: Snapshot build

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-push:
    name: Build snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute snapshot tags
        id: tag
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMG="${{ env.REGISTRY }}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "value<<EOF"
            echo "${IMG}:dev"
            echo "${IMG}:dev-${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Trivy scan ────────────────────────────────────────────────────────────────
  # Snapshot scans REPORT ONLY — findings land in the Security tab but never
  # block the dev snapshot. The image scan in security.yml is the blocking one.
  scan:
    name: Trivy scan
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout (for .trivyignore)
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image ref
        id: img
        run: |
          IMG="${{ env.REGISTRY }}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${IMG}:dev" >> "$GITHUB_OUTPUT"

      - name: Scan for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          # Snapshot builds report only — do not block dev iteration.
          exit-code: '0'
          format: sarif
          output: trivy-snapshot.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-snapshot.sarif
          category: trivy-snapshot
