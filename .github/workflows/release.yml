# ── Diet App — Release ────────────────────────────────────────────────────────
#
# DISABLED while the project is in development. The workflow is switched off in
# the repository's Actions settings (`gh workflow disable release.yml`), so no
# tag starts it. It stays here as the scaffold for v1.0.0: enable it with
# `gh workflow enable release.yml` as part of that release.
#
# Triggered by a semver tag (v1.2.3) that points at a commit of `main`; the first
# job refuses a tag anywhere else. Builds the production image and pushes it to
# GitHub Container Registry by its digest alone, scans that digest, and only
# when the scan passed puts the version tags and `latest` on it and creates a
# GitHub Release whose notes are generated from .github/release.yml.
#
# Image: ghcr.io/whiteravens20/diet-app — the one image every service of
# infra/docker-compose.prod.yml runs from. Only a release tag moves `latest`; a
# snapshot of `main` is `:edge` (docker-snapshot.yml).
name: Release

on:
  push:
    # A release, never a pre-release: a tag such as v1.0.0-rc.1 would move `latest`.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  # github.event.base_ref is not set reliably for a tag pushed with
  # `git push origin <tag>`, so git is asked whether `main` holds the commit.
  check-branch:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check branch containment
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/main$' && exit 0
          echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on main. Release skipped."
          exit 1

  image:
    name: Build & push image
    needs: check-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # Sign the provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: infra/docker/Dockerfile
          # No tag yet: the `tag` job puts the tags on this digest after the scan.
          tags: ghcr.io/${{ github.repository }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      # Sigstore-signed build provenance, pushed to ghcr.io next to the image.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # No artifact storage record: it needs the artifact-metadata:write
          # permission and only feeds the org's Linked Artifacts page.
          create-storage-record: false

  # Reads the image that was pushed, by its digest, and fails on a HIGH or
  # CRITICAL finding that .trivyignore does not acknowledge. The tags and the
  # release wait for it; the findings land in the Security tab either way.
  scan:
    name: Trivy image scan
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # Pull the image from ghcr.io
      security-events: write  # Upload SARIF to the Security tab
    steps:
      - name: Checkout (for .trivyignore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-release.sarif
          # Without this, trivy-action widens the severity to ALL for SARIF, and
          # exit-code 1 then trips on MEDIUM and LOW findings too.
          limit-severities-for-sarif: true
      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-release.sarif
          category: trivy-release

  # Only an image the scan passed gets its tags, and each tag must then name the
  # very digest that was scanned.
  tag:
    name: Tag the scanned image
    needs: [image, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Put the tags on the scanned digest
        env:
          TAGS: ${{ needs.image.outputs.tags }}
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            [ "$got" = "$DIGEST" ] || { echo "::error::$tag names $got, not the scanned $DIGEST"; exit 1; }
            echo "$tag -> $got"
          done <<< "$TAGS"

  release:
    name: GitHub Release
    needs: [image, scan, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
