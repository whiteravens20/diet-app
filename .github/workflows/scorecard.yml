# ── Diet App — OpenSSF Scorecard ──────────────────────────────────────────────
#
# Scores the repository's security practices on every push to dev and weekly,
# and publishes the result to the public Scorecard API, which serves the README
# badge. Findings are not uploaded to code scanning.
#
# Publishing restricts this workflow: no top-level env or write permissions,
# and the job may only use the actions the Scorecard API accepts.
#
# ─────────────────────────────────────────────────────────────────────────────

name: Scorecard

on:
  push:
    branches: [dev]
  schedule:
    # Run weekly on Monday at 07:00 UTC
    - cron: '0 7 * * 1'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Publish the results to the Scorecard API

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: true
