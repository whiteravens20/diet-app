# ── Diet App — production stack (pre-built images from GHCR) ──────────────────
# Self-contained compose file for running Diet App on a server WITHOUT cloning
# the repo. Pulls the official multi-arch images from the GitHub Container
# Registry instead of building locally.
#
# Quick start (on the target server):
#
#   mkdir diet-app && cd diet-app
#   curl -O https://raw.githubusercontent.com/whiteravens20/diet-app/main/infra/docker-compose.prod.yml
#   curl -o .env https://raw.githubusercontent.com/whiteravens20/diet-app/main/.env.example
#   nano .env                                  # set secrets — see notes below
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Updating:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Optional services are profile-gated:
#   --profile ollama   → local self-hosted AI on the same host
#
# Pin to a specific image version by setting IMAGE_TAG=<tag> in .env
# (defaults to `latest`). Recommended for production: pin to a published
# release tag and only bump it after testing.
#
# ──────────────────────────────────────────────────────────────────────────────
# `.env` essentials — these MUST be set before first boot:
#   POSTGRES_PASSWORD          strong random value
#   JWT_ACCESS_SECRET          openssl rand -hex 32
#   JWT_REFRESH_SECRET         openssl rand -hex 32
#   AI_KEY_ENCRYPTION_SECRET   openssl rand -hex 32
#   DATA_ENCRYPTION_SECRET     openssl rand -hex 32  (NEVER change after first boot — existing accounts become unreadable)
#   ADMIN_PASSWORD             strong random value (admin panel auth)
#   APP_URL / API_URL          public origins your reverse proxy serves
# ──────────────────────────────────────────────────────────────────────────────

name: diet-app

services:
  postgres:
    image: postgres:18-alpine
    container_name: diet-app-db
    restart: unless-stopped
    networks: [diet-app]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diet}
      POSTGRES_DB: ${POSTGRES_DB:-diet_app}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-diet}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: diet-app-redis
    restart: unless-stopped
    networks: [diet-app]
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-shot: apply pending migrations and exit ─────────────────────────────
  # Same image as `api`, different entrypoint. `api` and `worker` depend on
  # this so they never start against an un-migrated database. Safe to re-run:
  # `migrate deploy` is a no-op when nothing is pending.
  #
  # Seeding the curated ingredient database is intentionally NOT done here —
  # it's a one-click admin action from `/admin` once the stack is up (see
  # README → "First-run").
  db-init:
    image: ghcr.io/whiteravens20/diet-app/api:${IMAGE_TAG:-latest}
    container_name: diet-app-db-init
    pull_policy: always
    networks: [diet-app]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
    working_dir: /app/apps/api
    command: ['/app/node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ghcr.io/whiteravens20/diet-app/api:${IMAGE_TAG:-latest}
    container_name: diet-app-api
    pull_policy: always
    restart: unless-stopped
    networks: [diet-app]
    env_file: .env
    environment:
      NODE_ENV: production
      # Override host-oriented .env values with Compose service hostnames.
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
      REDIS_URL: redis://redis:6379
      # Pin the internal listen port to 4000. The `web` image was built with
      # `API_PROXY_URL=http://api:4000` baked into its Next.js rewrites — it
      # cannot be changed at runtime. The `.env` API_PORT (intended for host
      # port mapping) must NOT leak in or NestJS will listen on the wrong port.
      API_PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    volumes:
      # Bind-mount a host `data/` directory so the admin USDA importer's
      # output (`ingredients.generated.json`) survives container recreates
      # and is shared with the worker. Created automatically on first boot.
      - ./data:/app/data
      # No `ports:` block — the API is reached by `web` over the internal Docker
      # network at `http://api:4000`, never from the public internet. If you
      # later want to serve a second subdomain (e.g. api.example.com for a
      # mobile companion app), add:
      #
      #   ports:
      #     - '127.0.0.1:${API_PORT:-4000}:4000'
      #
      # Left of the colon = host-side port (from .env, change if 4000 collides
      # with another service on the box). Right = container-internal port
      # (always 4000 — see the API_PORT override above).
    healthcheck:
      # 127.0.0.1, not localhost: the API binds IPv4 and busybox wget would
      # otherwise try localhost's IPv6 address first and fail. Port is pinned
      # to 4000 to match the API_PORT override above.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/whiteravens20/diet-app/api:${IMAGE_TAG:-latest}
    container_name: diet-app-worker
    pull_policy: always
    restart: unless-stopped
    networks: [diet-app]
    env_file: .env
    environment:
      NODE_ENV: production
      # Same hardcoded override as `api` / `db-init` — `.env`'s DATABASE_URL
      # uses `localhost` (correct for `npm run dev`), which would point the
      # worker at itself inside the network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
      REDIS_URL: redis://redis:6379
    # Same image as `api`, different entrypoint.
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    volumes:
      - ./data:/app/data

  web:
    image: ghcr.io/whiteravens20/diet-app/web:${IMAGE_TAG:-latest}
    container_name: diet-app-web
    pull_policy: always
    restart: unless-stopped
    networks: [diet-app]
    depends_on:
      - api
    # Bind to loopback so only a reverse proxy on the same host can reach it.
    # Drop the `127.0.0.1:` prefix to expose on all interfaces (e.g. if the
    # reverse proxy runs on a different host on the same private network).
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

  # ── Optional: local self-hosted AI ──────────────────────────────────────────
  # Enable with `--profile ollama`. Models are pulled on demand inside the
  # container (e.g. `docker compose exec ollama ollama pull llama3.1:8b`).
  # Set `AI_DEFAULT_PROVIDER=ollama` and `OLLAMA_BASE_URL=http://ollama:11434`
  # in .env.
  ollama:
    image: ollama/ollama:latest
    container_name: diet-app-ollama
    profiles: ['ollama']
    restart: unless-stopped
    networks: [diet-app]
    volumes:
      - ollama-models:/root/.ollama
    # No `ports:` block — the API reaches Ollama at `http://ollama:11434` on
    # the internal network. Add `ports: ['127.0.0.1:11434:11434']` if you want
    # to hit the Ollama API from the host (e.g. for `ollama pull` from CLI).

# Explicit named network so the stack is easy to reason about and external
# services (e.g. a reverse-proxy compose stack) can attach via
# `networks: { diet-app: { external: true, name: diet-app } }`.
networks:
  diet-app:
    name: diet-app
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  ollama-models:
