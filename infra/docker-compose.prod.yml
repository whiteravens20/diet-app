# ── Diet App — production stack (pre-built images from GHCR) ──────────────────
# Self-contained compose file for running Diet App on a server WITHOUT cloning
# the repo. Pulls the official image from the GitHub Container Registry instead
# of building locally. There is one image: the API, the worker, the migration
# job and the web front-end all run from it and differ only by their command,
# so one IMAGE_TAG pins the whole application.
#
# Quick start (on the target server):
#
#   mkdir diet-app && cd diet-app
#   curl -O https://raw.githubusercontent.com/whiteravens20/diet-app/main/infra/docker-compose.prod.yml
#   curl -o .env https://raw.githubusercontent.com/whiteravens20/diet-app/main/.env.example
#   nano .env                                  # set secrets — see notes below
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Updating:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Optional services are profile-gated:
#   --profile ollama   → local self-hosted AI on the same host
#
# Pin to a specific image version by setting IMAGE_TAG=<tag> in .env
# (defaults to `latest`). Recommended for production: pin to a published
# release tag and only bump it after testing.
#
# ──────────────────────────────────────────────────────────────────────────────
# `.env` essentials — these MUST be set before first boot. The API refuses to
# start on a secret that is blank, a template placeholder or too short:
#   POSTGRES_PASSWORD          strong random value
#   JWT_ACCESS_SECRET          openssl rand -hex 32
#   AI_KEY_ENCRYPTION_SECRET   openssl rand -hex 32
#   DATA_ENCRYPTION_SECRET     openssl rand -hex 32  (NEVER change after first boot — existing accounts become unreadable)
#   ADMIN_PASSWORD             strong random value (admin panel auth)
#   APP_URL                    the public origin your reverse proxy serves
# `sh scripts/init-env.sh` in a checkout of the repository writes a `.env` with
# the three secrets generated.
# ──────────────────────────────────────────────────────────────────────────────

name: diet-app

# Images that are not built here are pinned by version and digest: the digest
# is what gets pulled, the version says what it is. Dependabot moves both
# (.github/dependabot.yml).
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: diet-app-db
    restart: unless-stopped
    networks: [diet-app]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diet}
      POSTGRES_DB: ${POSTGRES_DB:-diet_app}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-diet}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-shot: seed the `app-data` volume from the image ────────────────────
  # The image bakes `data/*.json` (curated ingredients, recipes,
  # substitutions) into `/app/data`. Docker auto-populates a fresh named
  # volume from the image's contents on first attach, but does NOT re-seed it
  # on subsequent boots — so without this init, upgrading IMAGE_TAG would
  # leave the running stack on the old curated data.
  #
  # We mount the volume at `/target` (a non-/app/data path) so the image's
  # baked-in files are visible, then mirror the curated set in: the three
  # seed files, the shipped recipe batches and the ingredient name overrides.
  # They are image-owned, so they are always overwritten, and a batch or an
  # overrides file the new image no longer carries is removed.
  # The user-owned `ingredients.generated.json` (USDA importer output) is
  # left alone. Final chown gives the `node` user (uid 1000) in api / worker
  # write access for the USDA importer.
  data-init:
    image: ghcr.io/whiteravens20/diet-app:${IMAGE_TAG:-latest}
    container_name: diet-app-data-init
    pull_policy: always
    networks: [diet-app]
    user: root
    command:
      - sh
      - -c
      - |
        cp -f /app/data/ingredients.json   /target/ingredients.json
        cp -f /app/data/recipes.json       /target/recipes.json
        cp -f /app/data/substitutions.json /target/substitutions.json
        rm -rf /target/recipes /target/ingredient-overrides.json
        if [ -d /app/data/recipes ]; then cp -r /app/data/recipes /target/recipes; fi
        if [ -f /app/data/ingredient-overrides.json ]; then
          cp -f /app/data/ingredient-overrides.json /target/ingredient-overrides.json
        fi
        chown -R 1000:1000 /target
    volumes:
      - app-data:/target
    restart: 'no'

  # ── One-shot: apply pending migrations and exit ─────────────────────────────
  # Same image, different command. `api` and `worker` depend on this so they
  # never start against an un-migrated database. Safe to re-run:
  # `migrate deploy` is a no-op when nothing is pending.
  #
  # Seeding the curated ingredient database is intentionally NOT done here —
  # it's a one-click admin action from `/admin` once the stack is up (see
  # README → "First-run").
  db-init:
    image: ghcr.io/whiteravens20/diet-app:${IMAGE_TAG:-latest}
    container_name: diet-app-db-init
    pull_policy: always
    networks: [diet-app]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
    working_dir: /app/apps/api
    command: ['/app/node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ghcr.io/whiteravens20/diet-app:${IMAGE_TAG:-latest}
    container_name: diet-app-api
    pull_policy: always
    restart: unless-stopped
    networks: [diet-app]
    env_file: .env
    environment:
      NODE_ENV: production
      # Override host-oriented .env values with Compose service hostnames.
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
      # Pin the internal listen port to 4000. The web bundle in the image was
      # built with `API_PROXY_URL=http://api:4000` baked into its Next.js
      # rewrites — it cannot be changed at runtime. The `.env` API_PORT (intended for host
      # port mapping) must NOT leak in or NestJS will listen on the wrong port.
      API_PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      data-init: { condition: service_completed_successfully }
    volumes:
      # Named volume shared with `worker`. Curated `*.json` are seeded into
      # this volume by `data-init` on every boot (so image upgrades
      # propagate); the USDA importer writes `ingredients.generated.json`
      # here at runtime and that file survives container recreates.
      - app-data:/app/data
      # The instance's own files: its library of recipes, the names of
      # ingredients it gave and the version that wrote them, written from the
      # database after every ship, restore and update of the catalogue, and
      # read back by a restore. The `mirror` service below copies them into a
      # git repository of yours. Only this service writes here: Docker fills
      # a new volume from the image when a container first uses it, and two
      # containers created at the same moment on one new volume make the
      # first start fail, so `mirror` starts once this one is healthy.
      - instance-data:/app/instance-data
      # No `ports:` block — the API is reached by `web` over the internal Docker
      # network at `http://api:4000`, never from the public internet. If you
      # later want to serve a second subdomain (e.g. api.example.com for a
      # mobile companion app), add:
      #
      #   ports:
      #     - '127.0.0.1:${API_PORT:-4000}:4000'
      #
      # Left of the colon = host-side port (from .env, change if 4000 collides
      # with another service on the box). Right = container-internal port
      # (always 4000 — see the API_PORT override above).
    healthcheck:
      # 127.0.0.1, not localhost: the API binds IPv4 and busybox wget would
      # otherwise try localhost's IPv6 address first and fail. Port is pinned
      # to 4000 to match the API_PORT override above.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/whiteravens20/diet-app:${IMAGE_TAG:-latest}
    container_name: diet-app-worker
    pull_policy: always
    restart: unless-stopped
    networks: [diet-app]
    env_file: .env
    environment:
      NODE_ENV: production
      # Same hardcoded override as `api` / `db-init` — `.env`'s DATABASE_URL
      # uses `localhost` (correct for `npm run dev`), which would point the
      # worker at itself inside the network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
    # Same image, different command: runs scheduled tasks (weight-reminder
    # scan) on a single instance.
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      data-init: { condition: service_completed_successfully }
    volumes:
      - app-data:/app/data

  web:
    image: ghcr.io/whiteravens20/diet-app:${IMAGE_TAG:-latest}
    container_name: diet-app-web
    pull_policy: always
    restart: unless-stopped
    networks: [diet-app]
    # Same image, different command: the Next.js standalone server under /web.
    command: ['node', '/web/apps/web/server.js']
    environment:
      # The two settings of the instance the web server is told, and nothing
      # else from .env: it holds none of the instance's secrets. Whether the
      # public address is https decides the headers that are for https alone;
      # where Turnstile is on, the pages' content security policy has to
      # allow its frame.
      APP_URL: ${APP_URL:-http://localhost:3000}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
    volumes:
      # The operator's terms of service: TOS.md, and beside it a translation
      # for an interface language, named by its code (TOS.pl.md). Make the
      # directory before the first start, or Docker makes it empty and root's.
      # Without the files the page shows the template that comes with the
      # image; after a change, `docker compose restart web`.
      - ./terms:/terms:ro
    depends_on:
      - api
    healthcheck:
      # The standalone server listens on the container's own hostname, which
      # is not the loopback address.
      test: ['CMD-SHELL', 'wget -q --spider "http://$$(hostname):3000/" || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5
    # Bind to loopback so only a reverse proxy on the same host can reach it.
    # Drop the `127.0.0.1:` prefix to expose on all interfaces (e.g. if the
    # reverse proxy runs on a different host on the same private network).
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

  # ── Optional: local self-hosted AI ──────────────────────────────────────────
  # Enable with `--profile ollama`. Models are pulled on demand inside the
  # container (e.g. `docker compose exec ollama ollama pull llama3.1:8b`).
  # Set `AI_DEFAULT_PROVIDER=ollama` and `OLLAMA_BASE_URL=http://ollama:11434`
  # in .env.
  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    container_name: diet-app-ollama
    profiles: ['ollama']
    restart: unless-stopped
    networks: [diet-app]
    volumes:
      - ollama-models:/root/.ollama
    # No `ports:` block — the API reaches Ollama at `http://ollama:11434` on
    # the internal network. Add `ports: ['127.0.0.1:11434:11434']` if you want
    # to hit the Ollama API from the host (e.g. for `ollama pull` from CLI).

  # ── Optional: a copy of the instance's own files in a git repository ───────
  # Enable with `COMPOSE_PROFILES=mirror` in .env. Once an hour it copies the
  # files of the `instance-data` volume into the repository at MIRROR_REPO,
  # with a commit signed `<MIRROR_NAME>-mirror` when something changed, pushed
  # with the deploy key in ./mirror/key. It gets the volume read-only and the
  # key, and nothing else: no database, no setting of .env but its two, and a
  # network of its own. See docs/ops/deployment.md, "A copy of the instance's
  # own files".
  mirror:
    image: alpine/git:2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
    container_name: diet-app-mirror
    profiles: ['mirror']
    restart: unless-stopped
    networks: [mirror]
    entrypoint: ['sh', '/usr/local/bin/mirror']
    environment:
      MIRROR_REPO: ${MIRROR_REPO:-}
      MIRROR_NAME: ${MIRROR_NAME:-}
    configs:
      - source: mirror-script
        target: /usr/local/bin/mirror
    volumes:
      - instance-data:/instance:ro
      - ./mirror/key:/key:ro
      # Its clone of the repository, and the host key of the git server.
      - mirror-state:/state
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # Root in the container reads the key, which is the operator's file on the host.
    cap_add: [DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
    depends_on:
      api: { condition: service_healthy }

# Explicit named network so the stack is easy to reason about and external
# services (e.g. a reverse-proxy compose stack) can attach via
# `networks: { diet-app: { external: true, name: diet-app } }`.
networks:
  diet-app:
    name: diet-app
    driver: bridge
  # The mirror's own: it reaches the git server, and nothing of the stack.
  mirror:
    name: diet-app-mirror
    driver: bridge

volumes:
  postgres-data:
  ollama-models:
  # Curated `data/*.json` (from the image, refreshed by `data-init` on every
  # boot) + the user-owned `ingredients.generated.json` from the USDA
  # importer. Internal to the Docker engine — no host directory needed.
  # Inspect via `docker run --rm -v diet-app_app-data:/data alpine ls /data`.
  app-data:
  # The instance's own files (see the api service). Inspect via
  # `docker run --rm -v diet-app_instance-data:/data alpine ls /data`.
  instance-data:
  # The mirror's clone of its repository, and the git server's host key.
  mirror-state:

configs:
  # The mirror's script, carried in this file so that it stays the one file to
  # download. It is infra/mirror/mirror.sh with every `$` doubled, which keeps
  # Compose from filling it in; a test holds the two to each other.
  mirror-script:
    content: |
      #!/bin/sh
      # Copyright (C) 2026 White Ravens. AGPL-3.0-only with an additional term; see LICENSE and NOTICE.
      #
      # The `mirror` service of the Compose files: the instance's own files (its
      # library of recipes, the names of ingredients it gave and the version that
      # wrote them), copied once an hour into a git repository of the operator's,
      # with a commit when something changed, pushed with a deploy key. The release's
      # Compose file carries this script in its `configs`, so that it stays the one
      # file an operator downloads; a test holds the two to each other.
      #
      # It reads the instance's files and the key, and writes only the clone of the
      # repository and the host key of the git server, taken on the first connection
      # and held to after it. A repository that holds files of something else is
      # refused: a wrong address would otherwise have them deleted by the copy.
      set -u

      : "$${MIRROR_REPO:?set MIRROR_REPO in .env: the SSH address of the repository the copy goes to}"
      : "$${MIRROR_NAME:?set MIRROR_NAME in .env: the name of this instance, which signs the commits}"
      FILES=$${MIRROR_FILES:-/instance}
      STATE=$${MIRROR_STATE:-/state}
      KEY=$${MIRROR_KEY:-/key}
      EVERY=$${MIRROR_EVERY:-3600}
      TREE=$$STATE/tree
      WHO=$$MIRROR_NAME-mirror

      export HOME="$$STATE"
      export GIT_SSH_COMMAND="ssh -i $$KEY -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$$STATE/known_hosts -o StrictHostKeyChecking=accept-new"
      export GIT_AUTHOR_NAME="$$WHO" GIT_COMMITTER_NAME="$$WHO"
      export GIT_AUTHOR_EMAIL="$$WHO@diet-app.invalid" GIT_COMMITTER_EMAIL="$$WHO@diet-app.invalid"

      say() {
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) $$*"
      }

      # The clone, made in the first round. An empty repository is taken, and so is
      # one with nothing but a README, or one this copy has written to before.
      clone() {
        [ -d "$$TREE/.git" ] && return 0
        rm -rf "$$TREE"
        if ! git -c init.defaultBranch=main clone -q "$$MIRROR_REPO" "$$TREE" 2>"$$STATE/clone.log"; then
          say "could not clone $$MIRROR_REPO: $$(tail -n 1 "$$STATE/clone.log")"
          return 1
        fi
        others=$$(find "$$TREE" -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md | head -n 1)
        if [ -n "$$others" ] && ! head -n 1 "$$TREE/README.md" 2>/dev/null | grep -q '^# Diet App instance files'; then
          say "$$MIRROR_REPO holds files of something else, $$(basename "$$others") among them: give the copy an empty repository of its own"
          rm -rf "$$TREE"
          return 1
        fi
      }

      # What the repository says of itself, written once: the operator may change it,
      # and the copy leaves it alone after that.
      readme() {
        [ -f "$$TREE/README.md" ] && return 0
        cat >"$$TREE/README.md" <<EOF
      # Diet App instance files: $$MIRROR_NAME

      The files the Diet App instance "$$MIRROR_NAME" keeps in its directory of its own
      files, copied here by its \`mirror\` service so that they outlive the server.

      - \`manifest.json\`: the version of the application that wrote the files, and
        how many recipes and names they hold.
      - \`recipes/library.json\`: every recipe of the instance's own library, by
        slug, with its lines in their order.
      - \`ingredient-overrides.json\`: the names of ingredients the instance gave,
        without those the catalogue's own data gives as they are.

      The instance writes these files from its database after every ship into it,
      every restore and every update of the catalogue. Once an hour the service copies
      them here, and commits as \`$$WHO\` only when something changed. A file
      removed from the instance is removed here too. This README is the one file the
      copy leaves alone.

      ## Restoring

      1. Copy the files into the \`instance-data\` volume of the instance.
      2. Start the stack and choose **Update database** in the admin panel, which
         loads the catalogue's own data that the instance's recipes are made of.
      3. In the curation card, under "This instance's own files", choose **Restore
         from these files**.

      A restore refuses files that a newer version of the application wrote, as
      \`manifest.json\` says: update the application first.
      EOF
      }

      # The repository as it is now: its history is the repository's, the files are
      # the instance's. An operator's change of the README is taken in, and a commit
      # an earlier round could not push is made again from the files.
      catch_up() {
        if ! git -C "$$TREE" fetch -q origin 2>"$$STATE/fetch.log"; then
          say "could not reach $$MIRROR_REPO: $$(tail -n 1 "$$STATE/fetch.log")"
          return 1
        fi
        branch=$$(git -C "$$TREE" symbolic-ref --short HEAD)
        if git -C "$$TREE" rev-parse -q --verify "origin/$$branch" >/dev/null; then
          git -C "$$TREE" reset -q --hard "origin/$$branch"
        fi
      }

      round() {
        clone || return 1
        catch_up || return 1
        find "$$TREE" -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
        cp -R "$$FILES/." "$$TREE/"
        # A file the instance is in the middle of writing is not one of its files yet.
        find "$$TREE" -name '*.writing' -exec rm -f {} +
        readme
        git -C "$$TREE" add -A
        git -C "$$TREE" diff --cached --quiet && return 0
        git -C "$$TREE" commit -q -m "Instance files of $$(date -u '+%Y-%m-%d %H:%M') UTC"
        if git -C "$$TREE" push -q origin HEAD 2>"$$STATE/push.log"; then
          say "pushed a commit to $$MIRROR_REPO"
        else
          say "could not push to $$MIRROR_REPO: $$(tail -n 1 "$$STATE/push.log")"
        fi
      }

      while :; do
        round
        [ "$${MIRROR_ONCE:-}" = 1 ] && exit 0
        sleep "$$EVERY"
      done
