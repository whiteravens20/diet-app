# ── Diet App — production-like stack ──────────────────────────────────────────
# Run from the repo root:  docker compose -f infra/docker-compose.yml up -d
# Configure via the repo-root .env (copy from .env.example).
#
# Optional services are profile-gated:
#   --profile ollama   → local self-hosted AI
#   --profile proxy    → Traefik reverse proxy

name: diet-app

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diet}
      POSTGRES_DB: ${POSTGRES_DB:-diet_app}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-diet}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      # Override host-oriented .env values with Compose service hostnames.
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
      REDIS_URL: redis://redis:6379
    # Same image as `api`, different entrypoint.
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'

  # ── Optional: local self-hosted AI ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    profiles: ['ollama']
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '11434:11434'

  # ── Optional: reverse proxy ─────────────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    profiles: ['proxy']
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    ports:
      - '80:80'
    volumes:
      - ./traefik:/etc/traefik:ro

volumes:
  postgres-data:
  redis-data:
  ollama-models:
