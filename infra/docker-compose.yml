# ── Diet App — production-like stack ──────────────────────────────────────────
# Run from the repo root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# Configure via the repo-root .env (`sh scripts/init-env.sh` writes it).
#
# ⚠️  The `--env-file .env` flag is REQUIRED, not optional. Two distinct
#     mechanisms read .env and they are NOT the same:
#       • `env_file: ../.env` (below) injects the file into each container's
#         runtime environment (process.env) — JWT/AI/encryption secrets, etc.
#       • `${VAR}` placeholders in THIS file (port mappings, image tags, the
#         POSTGRES_* in `environment:`) are resolved by Compose's interpolation,
#         which reads its own `.env` from the *project directory* (= infra/),
#         NOT the repo root. infra/.env doesn't exist, so without --env-file
#         every `${VAR:-default}` silently falls back to its default. Most
#         defaults happen to match .env, so the breakage is invisible until you
#         override one to a non-default value (e.g. WEB_PORT) — then it's ignored.
#     `--env-file .env` points interpolation at the repo-root .env and fixes it.
#     (The prod stack docker-compose.prod.yml is immune: there the compose file
#     and .env live in the same directory.)
#
# Optional services are profile-gated:
#   --profile ollama   → local self-hosted AI
#   --profile proxy    → Traefik reverse proxy

name: diet-app

# One image, several roles (see infra/docker/Dockerfile): the API, the worker,
# the migration job and the web front-end all run from it and differ only by
# their command. Every app service below builds the same Dockerfile under one
# tag, so the layers are built once.
x-app-image: &app-image
  image: diet-app:local
  build:
    context: ..
    dockerfile: infra/docker/Dockerfile
    # The web proxies `/api/*` to the `api` service, so the browser only ever
    # talks to the web origin — no CORS, host-agnostic. The target is baked in
    # at build time.
    args:
      API_PROXY_URL: http://api:4000

# Images that are not built here are pinned by version and digest: the digest
# is what gets pulled, the version says what it is. Dependabot moves both
# (.github/dependabot.yml).
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diet}
      POSTGRES_DB: ${POSTGRES_DB:-diet_app}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-diet}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-shot: apply pending migrations and exit ─────────────────────────────
  # `api` and `worker` wait for this so they never start against an un-migrated
  # database. Safe to re-run: `migrate deploy` is a no-op when nothing is pending.
  #
  # Seeding the curated/USDA ingredient database is intentionally NOT done here
  # — it's an admin action triggered from `/admin` once the stack is up (see
  # `POST /api/admin/db/update`). Boot stays fast however large the catalogue is.
  db-init:
    <<: *app-image
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
    working_dir: /app/apps/api
    command: ['/app/node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *app-image
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      # Override host-oriented .env values with Compose service hostnames.
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
      # Inside the container the API always listens on 4000: the port mapping,
      # the health check and the web proxy all point there. API_PORT in .env
      # only chooses the host side of the mapping below.
      API_PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    volumes:
      # Bind-mount the host `data/` directory so the admin-panel USDA
      # importer writes `ingredients.generated.json` to a path that
      # survives container recreates and is visible to the host (and to
      # the worker, which shares the same mount).
      - ../data:/app/data
      # What this instance added to its catalogue: a ship into the instance
      # copies the recipes and names it shipped here, and the admin panel can
      # restore from these files on a new server. A named volume (not a host
      # bind-mount) so Docker manages ownership: the image creates
      # /app/instance-data node-owned and the volume inherits it, so the
      # runtime `node` user can write. To copy it onto the host:
      # `docker run --rm -v diet-app_instance-data:/d alpine tar -C /d -cf - .`.
      # Only this service mounts it: Docker fills a new volume from the image
      # when a container first uses it, and two containers created at the same
      # moment on one new volume make the first start fail.
      - instance-data:/app/instance-data
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      # 127.0.0.1, not localhost: the API binds IPv4 and busybox wget would
      # otherwise try localhost's IPv6 address first and fail.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-image
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@postgres:5432/${POSTGRES_DB:-diet_app}?schema=public
      API_PORT: 4000
    # Same image, different command: runs scheduled tasks (weight-reminder
    # scan) on a single instance.
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    volumes:
      - ../data:/app/data

  web:
    <<: *app-image
    # Same image, different command: the Next.js standalone server under /web.
    command: ['node', '/web/apps/web/server.js']
    restart: unless-stopped
    environment:
      # The two settings of the instance the web server is told, and nothing
      # else from .env: it holds none of the instance's secrets. Whether the
      # public address is https decides the headers that are for https alone;
      # where Turnstile is on, the pages' content security policy has to
      # allow its frame.
      APP_URL: ${APP_URL:-http://localhost:3000}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      # The standalone server listens on the container's own hostname, which
      # is not the loopback address.
      test: ['CMD-SHELL', 'wget -q --spider "http://$$(hostname):3000/" || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

  # ── Optional: local self-hosted AI ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: ['ollama']
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '11434:11434'

  # ── Optional: reverse proxy ─────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    profiles: ['proxy']
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    ports:
      - '80:80'
    volumes:
      - ./traefik:/etc/traefik:ro

volumes:
  postgres-data:
  ollama-models:
  # Curation-queue ship sidecars (gitignored backups). Named volume so Docker
  # owns it as the image's `node` user — see the api service's volumes comment.
  instance-data:
