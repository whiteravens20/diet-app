# ── Diet App — development stack ──────────────────────────────────────────────
# Postgres in a container; run the apps on the host with `npm run dev`
# for fast HMR. Or `docker compose -f infra/docker-compose.dev.yml --profile full
# up` to also containerise the API + web.
#
#   docker compose -f infra/docker-compose.dev.yml up -d   # just the datastore

name: diet-app-dev

# Images that are not built here are pinned by version and digest: the digest
# is what gets pulled, the version says what it is. Dependabot moves both
# (.github/dependabot.yml).
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diet}
      POSTGRES_DB: ${POSTGRES_DB:-diet_app}
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-diet}']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: ['ollama']
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama-dev:/root/.ollama

volumes:
  postgres-dev:
  ollama-dev:
